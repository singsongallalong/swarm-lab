# One table per provider. `runtime = "claude-code"` runs the `claude` CLI headless
# against the provider's Anthropic-compatible endpoint, so generators get the same
# tools (Read, Edit, Bash, image reading) as any Claude Code session.
#
# Prices are USD per million tokens and only feed the cost report. CHECK THEM against
# the provider's own price page before a run: these were taken on 2026-10-28 from
# trackers that disagreed with each other (docs/experiment.md, "Prices").

[deepseek]
runtime = "claude-code"
base_url = "https://api.deepseek.com/anthropic"
key_env = "DEEPSEEK_API_KEY"
# Served by DeepSeek-V4.1-Flash-1017, the only DeepSeek model that reads images.
# "[1m]" tells Claude Code its window is 1M tokens (DeepSeek's Claude Code guide).
model = "deepseek-flash[1m]"
small_model = "deepseek-flash"
price_in = 0.30
# V4.1 Flash's cache hit is $0.006 per 1M (computeprices.com, 2026-10-29), not 0.03. Even
# so the estimate stays above the bill (fafwa, 2026-10-30: about $11 real for ~890M tokens,
# against ~$19 at these rates), likely from DeepSeek's off-peak halving: high, on purpose.
price_cached = 0.006
price_out = 1.20
max_turns = 40
timeout_s = 2400
# Whole-run cap across this provider's generators. Counts cached reads, which are nearly
# all of it and nearly free ($0.006 per million): rimeholt-features (12 builders, 2026-10-30)
# spent 30M on its first six. 300M is about $3 at the estimate's rates.
budget_tokens = 300_000_000

# Time-of-day pricing (swarm/offpeak.py): full price only in these Beijing-time windows on
# weekdays, half price otherwise and all weekend. `python3 -m swarm when` says where now
# falls; `run --offpeak` waits for a window the run fits in.
[deepseek.peak]
beijing = ["09:00-12:00", "14:00-18:00"]
weekends_off = true

# From DeepSeek's Claude Code guide (api-docs.deepseek.com/quick_start/agent_integrations/claude_code).
# Every model slot points at Flash: DeepSeek maps any claude-opus name to V4 Pro, which
# can't see images, so a generator falling back to an Opus default would go blind.
[deepseek.env]
ANTHROPIC_DEFAULT_OPUS_MODEL = "deepseek-flash[1m]"
ANTHROPIC_DEFAULT_SONNET_MODEL = "deepseek-flash[1m]"
ANTHROPIC_DEFAULT_HAIKU_MODEL = "deepseek-flash"
CLAUDE_CODE_SUBAGENT_MODEL = "deepseek-flash"
CLAUDE_CODE_EFFORT_LEVEL = "max"          # DeepSeek's recommendation; try "high" later to cut output tokens
CLAUDE_CODE_AUTO_COMPACT_WINDOW = "786432"
# Claude Code caps one reply at 32,000 output tokens by default, and a big file written
# at max effort can pass it (courtly-gowns, 2026-10-29: one of six generators failed on
# it). DeepSeek allows far more per reply.
CLAUDE_CODE_MAX_OUTPUT_TOKENS = "64000"

[qwen]
runtime = "claude-code"
# VERIFY: Alibaba Model Studio's Anthropic-compatible endpoint and the exact model id
# for your account and region. If there is none, set runtime = "opencode" (not yet
# built; see docs/experiment.md, "Open").
base_url = "https://dashscope-intl.aliyuncs.com/apps/anthropic"
key_env = "DASHSCOPE_API_KEY"
model = "qwen3.6-flash"
small_model = "qwen3.6-flash"
price_in = 0.25
price_cached = 0.05
price_out = 1.50
max_turns = 40
timeout_s = 2400
budget_tokens = 30_000_000

[kimi]
runtime = "claude-code"
# VERIFY the endpoint and model id before use.
base_url = "https://api.moonshot.ai/anthropic"
key_env = "MOONSHOT_API_KEY"
model = "kimi-k2.6"
small_model = "kimi-k2.6"
price_in = 0.55
price_cached = 0.19
price_out = 2.65
max_turns = 40
timeout_s = 2400
budget_tokens = 20_000_000

# The control arm: the same harness on Claude, for a like-for-like comparison.
[claude]
runtime = "claude-code"
key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-5-5"
small_model = "claude-haiku-5-5"
# Fill these in from https://docs.claude.com pricing before using this arm; the cost
# report shows 0 until then.
price_in = 0.0
price_cached = 0.0
price_out = 0.0
max_turns = 40
timeout_s = 2400
budget_tokens = 10_000_000
