# The frozen lake of Rimeholt again, loosened (2026-10-30): fafwa found rimelake-maps' six
# "solid stylistically but very similar to the moor ... very small ... no novel environmental
# effect". Own cells, heights, size, effects and shots; judged by a render-only critic.
skill = "Rimelake"
family = "map"
tileset = "rimeholt"
# Rimeholt's look now comes with the job's platform.
directions = "directions-rimelake-open.txt"
brief = """
Lay out the whole map of Rimeholt's frozen lake: a highland where a hill-folk's barrows and
runestones lie under old snow beside a lake that never thaws. Its look already exists: the
`rimeholt` tileset (blue-grey snow, black rimed pines, grey granite, an ice-blue accent, amber
hill-fires along the road) with its sculpts in Sculpts:

- `rimeholt_ice`: a sheet of pale ice, 24 x 24 studs at scale 1 (you no longer need to tile
  it into a lake: make the lake's surface as your own cell kind).
- `rimeholt_runestones`: a ring of standing runestones, 18 studs across.
- `rimeholt_barrow`: a hill-king's barrow, 16 x 12 studs.
- `rimeholt_pine`, `rimeholt_pine_snapped`, `rimeholt_boulder`, `rimeholt_hillfire` (a
  burning brazier), `rimeholt_marker` (a waymarker stone).

**The frozen lake is the heart of the map**: the player crosses it, fights on it, sees it
from above. The last run made six small flat bowls with a lake in the middle, dressed like
the moor, and nothing moved. This time make a place nobody has seen in this game: big,
with height, with ground of your own making (ice of your own colour, black open water,
heaved ridges, frozen falls, spires), an effect that makes it live, and one photograph from
inside it worth stopping for. Your direction below says which place; push it further than
feels safe. Keep the moor's kind of boundary (rims with edges).

It's judged by a critic who sees only your renders: your shots most of all, then the whole
map from above over three seeds against the moor in the same look, your effect, your
landmark up close. Every seed must be a sound map (problems and draftProblems) inside the
phone budget.
"""
