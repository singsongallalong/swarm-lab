skill = "Smash"
family = "motion"
weapon = "EmberMace"
brief = """
A one-handed overhead smash with a mace. `castTime = 0.6`: the blow lands 0.6 s after the
press. `layer = "FullBody"` (the hips drop and lunge with it). In words, key by key:

1. **Gather** (about a quarter of the way to the blow): the weight sinks back, the mace
   drawn down and back past the right hip, its head trailing low behind.
2. **Raise** (about two thirds of the way): the mace held high above the head, its head
   pointing back and down behind the shoulders, the chest arched back and turned a little
   to the right, the body risen tall.
3. **Smash** (the blow, at 0.6 s): the mace brought over the top and down in front, its
   head meeting the ground a stride ahead, the chest folded forward over it, the knees bent
   deep, the hips lunging forward behind the blow. Cue `Impact` here.
4. **Settle** (just after the blow): held low for a beat, the weight forward, the head on
   the ground.
5. **Recover** (about half a second after): straightening, the mace lifted back toward the
   carry, and the body handed back to the rig by about 0.9 s after the blow.

The key times are a guide: place them, add in-between poses, holds and kicks wherever they
make it read better and heavier.
"""
