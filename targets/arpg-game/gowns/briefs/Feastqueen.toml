brief = """
Zone: the Grashan Feast (rare map, levels 16-20): the Grashan Ruins dreamed whole, golden and lit at their height, the shades living people at a great feast, until the feast goes wrong. Make an epic feast gown: the most splendid dress of the ancient court, golden and candle-warm, with a hint of the dream souring. Palette: rich gold, wine red, candle amber, ivory, a little shade-black creeping in.

The game's world is night-bound and muted (docs/art/bible.md). From the high ARPG camera the
set must read as its own family, apart from iron, leather, studded, linen, fenscale, the
courtly and classic gowns and the Drowned Marches gowns already made. Pretty and feminine
first: this set exists so players who want a lovely dress have one, and it must still
belong in its zone. Give the skirt a real flare or bell from the hip, and keep the sleeves
slim: block sleeves the width of the shoulders read as broad and bulky from above, the
flaw critics found in every earlier gown.

Make all four slots: Helm (headpiece), Chest (bodice and upper skirt), Gloves (sleeves and
hands), Boots (lower skirt, hem and shoes). Name them FeastqueenHelm, FeastqueenDress, FeastqueenSleeves and FeastqueenHem
unless your idea calls for better names (keep the Feastqueen prefix). Aim for 80 parts or fewer for
the whole set (the budget is 100; fewer, bolder parts read better from above). Looks only:
no base, numbers or drop weight.

This is an EPIC set: a rare drop players should notice across the field. Later it will get
a worn particle effect (an aura drawn by the game, not by you), so build places for light
to live: glowing seams, gems, a crown or halo shape, cracks, using Neon sparingly on two or
three small parts. No particles, lights or beams in the look itself.
"""
