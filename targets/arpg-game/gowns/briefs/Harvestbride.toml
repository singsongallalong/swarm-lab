Zone: Farmland (levels 1-3): lived-in farmland round the town, ramping out in three bands, a fort and tower as its landmark. Make a country gown: what a farm girl wears to the harvest festival or a wedding in the village, warm and homely beside the gothic dark. Palette: wheat gold, apron linen, hearth red, field green, dark walnut.

The game's world is night-bound and muted (docs/art/bible.md). From the high ARPG camera the
set must read as its own family, apart from iron, leather, studded, linen, fenscale, the
courtly and classic gowns and the Drowned Marches gowns already made. Pretty and feminine
first: this set exists so players who want a lovely dress have one, and it must still
belong in its zone. Give the skirt a real flare or bell from the hip, and keep the sleeves
slim: block sleeves the width of the shoulders read as broad and bulky from above, the
flaw critics found in every earlier gown.

Make all four slots: Helm (headpiece), Chest (bodice and upper skirt), Gloves (sleeves and
hands), Boots (lower skirt, hem and shoes). Name them HarvestbrideHelm, HarvestbrideDress, HarvestbrideSleeves and HarvestbrideHem
unless your idea calls for better names (keep the Harvestbride prefix). Aim for 80 parts or fewer for
the whole set (the budget is 100; fewer, bolder parts read better from above). Looks only:
no base, numbers or drop weight.
"""
