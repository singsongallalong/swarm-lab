brief = """
Zone: the Sunken Shelf (levels 12-16): tidal flats where the Naga came ashore, wrecks, a war camp of salvaged hulls, a leviathan's ribcage in the shallows. Make a set for a woman of the shore or a corsair: an armoured or sea-going dress made of salvage, shell and sailcloth, with a skirt that flares or drapes. Pretty and a little bold. Palette: salt white, driftwood grey-brown, wet sand, tarnished brass, and the Naga's teal used sparingly.

The game's world is night-bound and muted (docs/art/bible.md). From the high ARPG camera the
set must read as its own family, apart from iron, leather, studded, linen, fenscale and the
courtly and classic gowns already made. Pretty and feminine first: this set exists so players
who want a lovely dress have one, and it must still belong in its zone.

Make all four slots: Helm (headpiece), Chest (bodice and upper skirt), Gloves (sleeves and
hands), Boots (lower skirt, hem and shoes). Name them TidewrackHelm, TidewrackDress, TidewrackSleeves and TidewrackHem
unless your idea calls for better names (keep the Tidewrack prefix). Aim for 80 parts or fewer for
the whole set (the budget is 100; fewer, bolder parts read better from above). Looks only:
no base, numbers or drop weight.
"""
