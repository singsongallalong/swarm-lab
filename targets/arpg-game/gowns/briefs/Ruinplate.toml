brief = """
Zone: the Fetid Forest (levels 12-16), round the pale-stone ruins of the Grashan ancients. Make an armoured skirt set: a knightly woman's harness with a full plated or tasseted skirt, carved from or inspired by the pale ruin stone and the old Grashan style (simple, heavy, ancient), overgrown with a little moss. Feminine lines: a fitted cuirass, a flared plate skirt, slim gauntlets, a crowned or crested helm. Palette: pale ruin stone, old bronze, moss green.

The game's world is night-bound and muted (docs/art/bible.md). From the high ARPG camera the
set must read as its own family, apart from iron, leather, studded, linen, fenscale and the
courtly and classic gowns already made. Pretty and feminine first: this set exists so players
who want a lovely dress have one, and it must still belong in its zone.

Make all four slots: Helm (headpiece), Chest (bodice and upper skirt), Gloves (sleeves and
hands), Boots (lower skirt, hem and shoes). Name them RuinplateHelm, RuinplateDress, RuinplateSleeves and RuinplateHem
unless your idea calls for better names (keep the Ruinplate prefix). Aim for 80 parts or fewer for
the whole set (the budget is 100; fewer, bolder parts read better from above). Looks only:
no base, numbers or drop weight.
"""
