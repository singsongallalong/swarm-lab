# The motion pilot, arm B, pass 2 of 2 (docs/motion-pilot.md): timing and polish on the
# best block from smash-block-1, which the brief's patch puts in the game.
skill = "SmashBlock"
family = "motion"
weapon = "EmberMace"
patches = ["results/smash-block-1/best-block.patch"]
brief = """
A one-handed overhead smash with a mace. `castTime = 0.6`: the blow lands 0.6 s after the
press. `layer = "FullBody"` (the hips drop and lunge with it). In words, key by key:

1. **Gather** (about a quarter of the way to the blow): the weight sinks back, the mace
   drawn down and back past the right hip, its head trailing low behind.
2. **Raise** (about two thirds of the way): the mace held high above the head, its head
   pointing back and down behind the shoulders, the chest arched back and turned a little
   to the right, the body risen tall.
3. **Smash** (the blow, at 0.6 s): the mace brought over the top and down in front, its
   head meeting the ground a stride ahead, the chest folded forward over it, the knees bent
   deep, the hips lunging forward behind the blow. Cue `Impact` here.
4. **Settle** (just after the blow): held low for a beat, the weight forward, the head on
   the ground.
5. **Recover** (about half a second after): straightening, the mace lifted back toward the
   carry, and the body handed back to the rig by about 0.9 s after the blow.

**This is the timing and polish pass.** Another animator blocked this motion: the row
`CastDrafts.SmashBlock` already holds five key poses, `Gather`, `Raise`, `Smash`, `Settle` and
`Recover`, on a plain timeline, and a critic picked it as the best block. Render it first, as
it is, and read its faults. Your job is to make it move:

- **Keep each key pose recognisably itself.** Fix a pose that breaks a lab rule, but don't
  replace the block's idea of it.
- **Timing:** move the key times so the wind-up gathers slowly and the blow is fast; hold the
  impact long enough to read.
- **In-betweens:** add poses where the motion needs them: an anticipation dip before the raise,
  a passing pose on the way over the top so the head travels an arc and not a straight line,
  an overshoot after the blow, a settle.
- **Holds and kicks** where they add weight.

The critic judges the whole motion: each moment recognisable, the blow heavy, the body clean,
the arc over the top, the recovery.
"""
