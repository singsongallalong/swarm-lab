brief = """
Zone: the Grashan Ruins (levels 16-20), round the Statue Colossus that walks the plain. Make the armour of the ancient Grashan sentinels, the warriors the statues were carved after: massive, simple and heavy, old bronze and pale stone. Palette: old green-bronze, pale ruin stone, sun gold.

The game's world is night-bound and muted (docs/art/bible.md). From the high ARPG camera the
set must read as its own family, apart from iron (grey and broad), leather (brown and slim),
studded (oxblood with brass), linen (pale oatmeal), fenscale (grey-green) and the six Reaver
sets (hide, fur and bone), and still sit in the same gothic world. One strong silhouette
idea (a helm shape, a pauldron line, a cape) beats many small details.

Make all four slots: Helm, Chest, Gloves, Boots. Name them SunwardenHelm, SunwardenChest, SunwardenGloves and
SunwardenBoots unless your idea calls for better names (keep the Sunwarden prefix). The budget is 64
parts for the whole set. Looks only: no base, numbers or drop weight.
"""
