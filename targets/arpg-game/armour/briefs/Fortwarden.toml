brief = """
Zone: Farmland (levels 1-3), round the town's fort and tower. Make the kit of the fort's garrison: the town's own soldiers, the first real armour a new player sees on others. Heraldic, sturdy, honest. Palette: town blue and cream heraldry, steel, brown leather, a brass badge.

The game's world is night-bound and muted (docs/art/bible.md). From the high ARPG camera the
set must read as its own family, apart from iron (grey and broad), leather (brown and slim),
studded (oxblood with brass), linen (pale oatmeal), fenscale (grey-green) and the six Reaver
sets (hide, fur and bone), and still sit in the same gothic world. One strong silhouette
idea (a helm shape, a pauldron line, a cape) beats many small details.

Make all four slots: Helm, Chest, Gloves, Boots. Name them FortwardenHelm, FortwardenChest, FortwardenGloves and
FortwardenBoots unless your idea calls for better names (keep the Fortwarden prefix). The budget is 64
parts for the whole set. Looks only: no base, numbers or drop weight.
"""
