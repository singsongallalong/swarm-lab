Zone: the Broken Barrows (levels 3-5): a low field where the barrows burst open from inside and the new undead get up. Make the grave armour of an old barrow king's guard: buried with them centuries ago, dug out, still faintly regal. Palette: tarnished bronze, grave-moss green, bone, mould-black leather.

The game's world is night-bound and muted (docs/art/bible.md). From the high ARPG camera the
set must read as its own family, apart from iron (grey and broad), leather (brown and slim),
studded (oxblood with brass), linen (pale oatmeal), fenscale (grey-green) and the six Reaver
sets (hide, fur and bone), and still sit in the same gothic world. One strong silhouette
idea (a helm shape, a pauldron line, a cape) beats many small details.

Make all four slots: Helm, Chest, Gloves, Boots. Name them BarrowguardHelm, BarrowguardChest, BarrowguardGloves and
BarrowguardBoots unless your idea calls for better names (keep the Barrowguard prefix). The budget is 64
parts for the whole set. Looks only: no base, numbers or drop weight.
